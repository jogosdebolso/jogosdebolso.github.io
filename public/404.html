<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Página não encontrada — Jogos de Bolso</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #f3f4f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 35%, rgb(56 189 248 / 10%), transparent 48%),
          #0b1020;
      }

      main {
        width: min(100%, 480px);
        padding: 48px 32px;
        border: 1px solid rgb(148 163 184 / 18%);
        border-radius: 20px;
        background: rgb(20 26 44 / 82%);
        text-align: center;
      }

      .brand {
        color: #c4b5fd;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .brand-accent {
        color: #67e8f9;
      }

      .code {
        margin: 40px 0 8px;
        color: #67e8f9;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 40px);
        letter-spacing: -0.05em;
      }

      p {
        margin: 14px 0 28px;
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 10px;
        background: #67e8f9;
        color: #111827;
        font-size: 13px;
        font-weight: 750;
        text-decoration: none;
        transition: background 160ms ease, transform 160ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        background: #a5f3fc;
      }

      a:focus-visible {
        outline: 2px solid #e9d5ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">jogos<span class="brand-accent">.</span>de bolso</div>
      <div class="code">Erro 404</div>
      <h1>Este mundo não existe.</h1>
      <p>O endereço pode estar incorreto ou a página foi movida.</p>
      <a href="/">Voltar ao catálogo</a>
    </main>
  </body>
</html>
